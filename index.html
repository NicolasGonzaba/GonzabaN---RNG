<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <div class="grid">
        <div class="grid-rng">
            <h1>Random Codestack Name Generator</h1>
        </div>

        <div class="grid-generate container main">
            <h2 id="firstName">First Name</h2>
            <h2 id="lastName">Last Name</h2>
            <h2 id="codestack">Codestack.co</h2>
            <h2 id="email">Email</h2>

        </div>

        <div class="grid-btn align-content-center">
            <button type="button" class="btn btn-primary" id="studentBtn">Generate a stundent</button>

        </div>

        <div class="grid-last">
            <h1>Last 5 names</h1>
        </div>

        <div class="grid-name1">
            <div class="container purple">
                <h3 id="firstName2"></h3>
                <h3 id="lastName2"></h3>
                <h3 id="codestack2"></h3>
                <h3 id="email2"></h3>
            </div>
        </div>

        <div class="grid-name2">
            <div class="container purple">
                <h3 id="firstName3"></h3>
                <h3 id="lastName3"></h3>
                <h3 id="codestack3"></h3>
                <h3 id="email3"></h3>
            </div>
        </div>

        <div class="grid-name3">
            <div class="container purple">
                <h3 id="firstName4"></h3>
                <h3 id="lastName4"></h3>
                <h3 id="codestack4"></h3>
                <h3 id="email4"></h3>
            </div>
        </div>

        <div class="grid-name4">
            <div class="container purple grid-name5">
                <h3 id="firstName5"></h3>
                <h3 id="lastName5"></h3>
                <h3 id="codestack5"></h3>
                <h3 id="email5"></h3>
            </div>
        </div>

        <div class="grid-name5">
            <div class="container purple">
                <h3 id="firstName6"></h3>
                <h3 id="lastName6"></h3>
                <h3 id="codestack6"></h3>
                <h3 id="email6"></h3>
            </div>
        </div>



    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="app.js"></script>
</body>

</html>
